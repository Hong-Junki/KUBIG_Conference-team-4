name: Sync BigQuery Scores To Supabase

on:
  schedule:
    # GitHub Actions cron is UTC. This runs every 15 minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT || vars.GOOGLE_CLOUD_PROJECT || 'conflict-ew-mvp-20260604' }}
      GCP_PROJECT_ID: ${{ secrets.GOOGLE_CLOUD_PROJECT || vars.GOOGLE_CLOUD_PROJECT || 'conflict-ew-mvp-20260604' }}
      BIGQUERY_DATASET: ${{ vars.BIGQUERY_DATASET || 'conflict_ew' }}
      BIGQUERY_MODEL_SCORES_TABLE: ${{ vars.BIGQUERY_MODEL_SCORES_TABLE || 'model_scores' }}
      BIGQUERY_MODEL_INPUT_TABLE: ${{ vars.BIGQUERY_MODEL_INPUT_TABLE || 'model_input' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ONSET_MODEL_VERSION_ID: onset_prod_lstm_v1
      ONSET_MODEL_NAME: onset_prod_lstm
      ONSET_TARGET_NAME: y_onset
      ONSET_HORIZON_DAYS: "7"
      ONSET_LOW_THRESHOLD: "25"
      ONSET_MEDIUM_THRESHOLD: "40"
      ONSET_HIGH_THRESHOLD: "70"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            google-cloud-bigquery \
            google-cloud-bigquery-storage \
            db-dtypes \
            pandas \
            numpy \
            psycopg[binary] \
            python-dotenv \
            pyarrow

      - name: Configure Google credentials
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          required = ["GOOGLE_CLOUD_PROJECT", "DATABASE_URL", "GCP_SERVICE_ACCOUNT_JSON"]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing required GitHub secrets/env values: {', '.join(missing)}")

          raw = os.environ["GCP_SERVICE_ACCOUNT_JSON"].strip()
          if raw.startswith(("'", '"')) and raw.endswith(("'", '"')):
              raw = raw[1:-1]
          try:
              payload = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(
                  "GCP_SERVICE_ACCOUNT_JSON must be the full service-account JSON text, "
                  f"not a file path or .env block. JSON parse failed: {exc}"
              )

          for key in ["type", "project_id", "private_key", "client_email", "token_uri"]:
              if not payload.get(key):
                  raise SystemExit(f"GCP_SERVICE_ACCOUNT_JSON is missing required key: {key}")

          path = Path(os.environ["RUNNER_TEMP"]) / "gcp-service-account.json"
          path.write_text(json.dumps(payload), encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"GOOGLE_APPLICATION_CREDENTIALS={path}\n")

      - name: Sync latest dashboard scores
        run: python sync_bq_model_scores_to_supabase.py
