name: Sync BigQuery Scores To Supabase

on:
  schedule:
    # GitHub Actions cron is UTC. This runs every 15 minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      GCP_PROJECT_ID: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      BIGQUERY_DATASET: ${{ vars.BIGQUERY_DATASET || 'conflict_ew' }}
      BIGQUERY_MODEL_SCORES_TABLE: ${{ vars.BIGQUERY_MODEL_SCORES_TABLE || 'model_scores' }}
      BIGQUERY_MODEL_INPUT_TABLE: ${{ vars.BIGQUERY_MODEL_INPUT_TABLE || 'model_input' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ONSET_MODEL_VERSION_ID: onset_prod_lstm_v1
      ONSET_MODEL_NAME: onset_prod_lstm
      ONSET_TARGET_NAME: y_onset
      ONSET_HORIZON_DAYS: "7"
      ONSET_LOW_THRESHOLD: "25"
      ONSET_MEDIUM_THRESHOLD: "40"
      ONSET_HIGH_THRESHOLD: "70"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            google-cloud-bigquery \
            google-cloud-bigquery-storage \
            db-dtypes \
            pandas \
            numpy \
            psycopg[binary] \
            python-dotenv \
            pyarrow

      - name: Configure Google credentials
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/gcp-service-account.json" <<'EOF'
          ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          EOF
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-service-account.json" >> "$GITHUB_ENV"

      - name: Sync latest dashboard scores
        run: python sync_bq_model_scores_to_supabase.py
