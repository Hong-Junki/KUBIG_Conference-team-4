name: Incremental Data Collection

# ──────────────────────────────────────────────
# 실행 조건
# ──────────────────────────────────────────────
# 수동 실행 및 자동 일일 실행
#   schedule: 매일 01:20 UTC / 매일 10:20 KST
#   workflow_dispatch: 수동 날짜 지정 및 dry-run 가능
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "수집할 소스 (공백 구분). 예: gdelt economic gdelt_titles"
        required: false
        default: "gdelt economic gdelt_titles"
        type: string
      dry_run:
        description: "dry-run 모드 (실제 BQ 쓰기 없음)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      overlap_days:
        description: "overlap 일수 (미지정 시 소스별 기본값 사용)"
        required: false
        default: ""
        type: string
      start:
        description: "수동 날짜 범위 시작일 YYYY-MM-DD (선택). end와 함께 입력하거나 둘 다 비워야 함."
        required: false
        default: ""
        type: string
      end:
        description: "수동 날짜 범위 종료일 YYYY-MM-DD (선택). start와 함께 입력하거나 둘 다 비워야 함."
        required: false
        default: ""
        type: string
  # 매일 01:20 UTC / 매일 10:20 KST
  schedule:
    - cron: "20 1 * * *"

# ──────────────────────────────────────────────
# 담당 범위: raw BQ 테이블 적재까지
#   대상: conflict_ew.gdelt_processed_events
#         conflict_ew.economic_daily
#         conflict_ew.gdelt_titles
#
#   담당하지 않음:
#     modeling_full_dataset, modeling_acled_free_view,
#     feature 생성, embedding, ACLED 레이블, 모델 추론
# ──────────────────────────────────────────────

# ──────────────────────────────────────────────
# 중복 실행 방지
# ──────────────────────────────────────────────
concurrency:
  group: incremental-data-collection
  cancel-in-progress: false  # 진행 중인 수집을 취소하지 않음

# ──────────────────────────────────────────────
# 최소 권한
# ──────────────────────────────────────────────
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  collect:
    name: Collect & Load
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ─── 1. Checkout ───────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 2. Python 설정 ────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # ─── 3. 의존성 설치 ────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ─── 4. Import 및 unit test ──────────
      - name: Run unit tests
        run: |
          python -m pytest tests/test_incremental.py -v --tb=short
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

      # ─── 5. GCP 인증 ─────────────────────
      # 권장: Workload Identity Federation (키 없음)
      # - name: Authenticate to Google Cloud (OIDC)
      #   uses: google-github-actions/auth@v2
      #   with:
      #     workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      #     service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      #
      # fallback: 서비스 계정 JSON (GitHub Secret GCP_SA_KEY에 저장)
      # JSON 내용은 절대 로그에 출력하지 않음.
      - name: Authenticate to Google Cloud (SA key fallback)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ─── 6. 날짜 입력 검증 ───────────────────
      # start/end는 둘 다 입력하거나 둘 다 비워야 함.
      # 하나만 입력, 잘못된 형식, start > end이면 실패.
      - name: Validate date inputs
        run: |
          START="${{ github.event.inputs.start }}"
          END="${{ github.event.inputs.end }}"
          DATE_RE='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'

          if [ -n "$START" ] && [ -z "$END" ]; then
            echo "오류: start를 입력했으나 end가 없습니다. 둘 다 입력하거나 둘 다 비워야 합니다."
            exit 1
          fi
          if [ -z "$START" ] && [ -n "$END" ]; then
            echo "오류: end를 입력했으나 start가 없습니다. 둘 다 입력하거나 둘 다 비워야 합니다."
            exit 1
          fi
          if [ -n "$START" ]; then
            if ! echo "$START" | grep -qE "$DATE_RE"; then
              echo "오류: start 형식이 YYYY-MM-DD가 아닙니다: '$START'"
              exit 1
            fi
          fi
          if [ -n "$END" ]; then
            if ! echo "$END" | grep -qE "$DATE_RE"; then
              echo "오류: end 형식이 YYYY-MM-DD가 아닙니다: '$END'"
              exit 1
            fi
          fi
          if [ -n "$START" ] && [ -n "$END" ]; then
            if [[ "$START" > "$END" ]]; then
              echo "오류: start($START)가 end($END)보다 이후입니다."
              exit 1
            fi
            echo "날짜 범위: $START ~ $END"
          else
            echo "날짜 범위: BQ MAX(date) 기반 증분 수집 (start/end 미입력)"
          fi

      # ─── 7. 권한 검증 (임시 테이블, raw table 변경 없음) ──
      - name: Validate BQ permissions
        run: |
          python -m src.collect.incremental.run_incremental --validate-permissions
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

      # ─── 8. BigQuery 현황 확인 (읽기 전용) ──
      - name: Validate BQ state (read-only)
        run: |
          python -m src.collect.incremental.run_incremental --validate-only
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

      # ─── 9. BQ dry-run (스캔량 확인) ─────
      - name: BigQuery dry-run (scan estimate)
        run: |
          SOURCES="${{ github.event.inputs.sources || 'gdelt economic gdelt_titles' }}"
          START="${{ github.event.inputs.start }}"
          END="${{ github.event.inputs.end }}"
          DATE_ARGS=""
          if [ -n "$START" ] && [ -n "$END" ]; then
            DATE_ARGS="--start $START --end $END"
          fi
          python -m src.collect.incremental.run_incremental \
            --sources $SOURCES \
            $DATE_ARGS \
            --dry-run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

      # ─── 10. 실제 증분 수집 ───────────────
      - name: Run incremental collection
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          SOURCES="${{ github.event.inputs.sources || 'gdelt economic gdelt_titles' }}"
          OVERLAP="${{ github.event.inputs.overlap_days }}"
          START="${{ github.event.inputs.start }}"
          END="${{ github.event.inputs.end }}"
          OVERLAP_ARG=""
          DATE_ARGS=""
          if [ -n "$OVERLAP" ]; then
            OVERLAP_ARG="--overlap-days $OVERLAP"
          fi
          if [ -n "$START" ] && [ -n "$END" ]; then
            DATE_ARGS="--start $START --end $END"
          fi
          python -m src.collect.incremental.run_incremental \
            --sources $SOURCES \
            $OVERLAP_ARG \
            $DATE_ARGS \
            --run-id "$GITHUB_RUN_ID"
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      # ─── 11. dry-run 전용 실행 ───────────
      - name: Run dry-run only
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          SOURCES="${{ github.event.inputs.sources || 'gdelt economic gdelt_titles' }}"
          START="${{ github.event.inputs.start }}"
          END="${{ github.event.inputs.end }}"
          DATE_ARGS=""
          if [ -n "$START" ] && [ -n "$END" ]; then
            DATE_ARGS="--start $START --end $END"
          fi
          python -m src.collect.incremental.run_incremental \
            --sources $SOURCES \
            $DATE_ARGS \
            --dry-run \
            --run-id "$GITHUB_RUN_ID"
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

      # ─── 12. 로그 artifact 업로드 ─────────
      - name: Upload collection logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30
