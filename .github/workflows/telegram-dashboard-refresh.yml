name: Refresh Telegram Dashboard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    env:
      LIMIT_PER_CHANNEL: "100"
      SINCE_DAYS: "30"
      MIN_CONFIDENCE: "0.0"
      GDELT_DAYS: "7"
      GDELT_MAX_COUNTRIES: "58"
      GDELT_TOP_TITLES: "3"
      GDELT_SUMMARY_MAX_COUNTRIES: "40"
      TELEGRAM_SUMMARY_MAX_EVENTS: "120"
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_SUMMARY_MODEL: ${{ vars.OPENAI_SUMMARY_MODEL || 'gpt-4.1-mini' }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Telegram workspace
        shell: bash
        run: |
          if [ -d "Telegram/scripts" ]; then
            echo "TELEGRAM_DIR=Telegram" >> "$GITHUB_ENV"
          else
            echo "TELEGRAM_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/requirements.txt"

      - name: Install dependencies
        shell: bash
        run: |
          cd "$TELEGRAM_DIR"
          python -m pip install -r requirements.txt

      - name: Materialize GCP credentials
        if: ${{ env.GCP_SERVICE_ACCOUNT_JSON != '' }}
        shell: bash
        run: |
          key_file="$RUNNER_TEMP/gcp-service-account.json"
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > "$key_file"
          chmod 600 "$key_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$key_file" >> "$GITHUB_ENV"

      - name: Refresh dashboard HTML
        shell: bash
        run: |
          cd "$TELEGRAM_DIR"
          python scripts/run_dashboard_refresh.py \
            --limit-per-channel "$LIMIT_PER_CHANNEL" \
            --since-days "$SINCE_DAYS" \
            --min-confidence "$MIN_CONFIDENCE" \
            --gdelt-days "$GDELT_DAYS" \
            --gdelt-max-countries "$GDELT_MAX_COUNTRIES" \
            --gdelt-top-titles "$GDELT_TOP_TITLES" \
            --gdelt-summary-max-countries "$GDELT_SUMMARY_MAX_COUNTRIES" \
            --telegram-max-events "$TELEGRAM_SUMMARY_MAX_EVENTS" \
            --publish-root .

      - name: Commit refreshed dashboard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TELEGRAM_DIR/index.html" \
                  "$TELEGRAM_DIR/live_osint.html" \
                  "$TELEGRAM_DIR/site/live_osint.html" \
                  "$TELEGRAM_DIR/artifacts/live_osint/live_events.db" \
                  "$TELEGRAM_DIR/artifacts/live_osint/live_events.json" \
                  "$TELEGRAM_DIR/artifacts/live_osint/gdelt_context.json" \
                  "$TELEGRAM_DIR/artifacts/live_osint/model_scores.json" \
                  "$TELEGRAM_DIR/artifacts/live_osint/audit_report.md"
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git commit -m "Refresh Telegram dashboard"
          # 다른 봇 커밋(점수 동기화 등)과의 푸시 경합 대비 재시도
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push 실패 (attempt $attempt) — rebase 후 재시도"
            git pull --rebase origin main
            sleep $((attempt * 5))
          done
          echo "::error::5회 재시도에도 push 실패"
          exit 1
